# nginx для linguich.ru. Копировать в /etc/nginx/sites-available/linguich
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/linguich
#   sudo ln -s /etc/nginx/sites-available/linguich /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сначала поднимаем этот конфиг БЕЗ блока TLS (только 80-й порт), получаем
# сертификат через certbot — он сам допишет 443 и редирект.

upstream linguich_app {
    server unix:/run/linguich/gunicorn.sock fail_timeout=0;
}

# Лимит на формы: защищает от перебора заявок и подбора пароля.
limit_req_zone $binary_remote_addr zone=linguich_forms:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name linguich.ru www.linguich.ru;

    # Certbot кладёт сюда проверочные файлы.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://linguich.ru$request_uri;
    }
}

server {
    # Отдельная директива «http2 on» появилась только в nginx 1.25, а в
    # Ubuntu 24.04 приезжает 1.24 — с ней конфиг просто не стартует. Старая
    # форма понятна обеим веткам, на 1.25+ она лишь предупреждает в nginx -t.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.linguich.ru;

    ssl_certificate     /etc/letsencrypt/live/linguich.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linguich.ru/privkey.pem;

    # Один канонический адрес: без www, иначе поисковики видят два сайта.
    return 301 https://linguich.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name linguich.ru;

    ssl_certificate     /etc/letsencrypt/live/linguich.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linguich.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    charset utf-8;
    client_max_body_size 25m;   # домашки с файлами и аудио

    access_log /var/log/nginx/linguich.access.log;
    error_log  /var/log/nginx/linguich.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/ttf font/woff2;

    # --- Статика ------------------------------------------------------------
    # Имена файлов после collectstatic содержат хеш, поэтому кэшируем навсегда.
    location /static/ {
        alias /srv/linguich/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Загруженные файлы: аватары, материалы, работы учеников.
    location /media/ {
        alias /srv/linguich/media/;
        access_log off;
        expires 7d;
        # Ничего исполняемого из media отдавать не нужно.
        add_header X-Content-Type-Options nosniff;
    }

    # robots.txt и sitemap.xml отдаёт Django — домен в них подставляется
    # из запроса, поэтому на тестовом поддомене они тоже верные.

    # --- Приложение ---------------------------------------------------------
    location / {
        proxy_pass http://linguich_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По этому заголовку Django понимает, что снаружи HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Формы входа и заявок — под лимитом частоты.
    location ~ ^/(accounts/login|api/lead|api/callback)/ {
        limit_req zone=linguich_forms burst=10 nodelay;
        proxy_pass http://linguich_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
